# Run continuous integration

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '22'
          cache: 'maven'
      - name: Install Tree-sitter native libraries
        run: |
          git clone --depth 1 https://github.com/tree-sitter/tree-sitter.git /tmp/tree-sitter
          cd /tmp/tree-sitter
          make -j$(nproc)
          sudo make install PREFIX=/usr/local
          git clone --depth 1 https://github.com/tree-sitter/tree-sitter-java.git /tmp/tree-sitter-java
          cd /tmp/tree-sitter-java
          cc -shared -fPIC -Isrc src/parser.c -o libtree-sitter-java.so
          sudo cp libtree-sitter-java.so /usr/local/lib/
          sudo ldconfig
      - name: Verify release contracts
        run: scripts/test-native-release.sh
      - name: Verify generated command catalog
        run: mvn -q -Dtest=CommandDocumentationContractTest test
      - name: Build with Maven
        run: mvn package -Djava.library.path=/usr/local/lib
        env:
          MAVEN_OPTS: "--enable-native-access=ALL-UNNAMED"
      - name: Test performance benchmark runner
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Run 1K performance smoke
        if: github.event_name == 'pull_request'
        run: |
          python3 scripts/perf_budget.py run \
            --root "$RUNNER_TEMP/jsrc-perf-1k" \
            --files 1000 --profile smoke \
            --jar target/jsrc.jar \
            --output "$RUNNER_TEMP/jsrc-perf-report.json"
        env:
          LD_LIBRARY_PATH: /usr/local/lib
      - name: Upload performance smoke report
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: jsrc-perf-smoke-1k
          path: ${{ runner.temp }}/jsrc-perf-report.json
