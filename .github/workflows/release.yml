name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-jar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '22'
          cache: 'maven'
      - name: Build fat JAR
        run: mvn -B -DskipTests package
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: jsrc-jar
          path: target/jsrc.jar
          if-no-files-found: error

  native-unix:
    name: Native ${{ matrix.target }}
    needs: build-jar
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-latest
            archive: jsrc-linux-x64.tar.gz
          - target: macos-x64
            runner: macos-15-intel
            archive: jsrc-macos-x64.tar.gz
          - target: macos-arm64
            runner: macos-15
            archive: jsrc-macos-arm64.tar.gz
    steps:
      - uses: actions/checkout@v4
      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: jsrc-jar
          path: target/
      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm-community'
      - name: Install Linux native dependencies
        if: matrix.target == 'linux-x64'
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev
      - name: Build and smoke-test native bundle
        run: scripts/build-native-unix.sh "${{ matrix.target }}"
      - name: Upload native bundle
        uses: actions/upload-artifact@v4
        with:
          name: jsrc-${{ matrix.target }}
          path: dist/${{ matrix.archive }}
          if-no-files-found: error

  native-windows-x64:
    needs: build-jar
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: jsrc-jar
          path: target/
      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm-community'
      - name: Build and smoke-test native bundle
        shell: pwsh
        run: ./scripts/build-native-windows.ps1
      - name: Upload native bundle
        uses: actions/upload-artifact@v4
        with:
          name: jsrc-windows-x64
          path: dist/jsrc-windows-x64.zip
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-jar, native-unix, native-windows-x64]
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: jsrc-*
          path: release/
          merge-multiple: true
      - name: Generate checksums
        working-directory: release
        run: sha256sum jsrc.jar jsrc-*.tar.gz jsrc-*.zip > checksums.txt
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/jsrc.jar
            release/jsrc-*.tar.gz
            release/jsrc-*.zip
            release/checksums.txt
          generate_release_notes: true
